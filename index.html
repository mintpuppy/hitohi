<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>HITOHI</title>
<meta name="description" content="1日1ページの紙の手帳を、iPadで。">
<meta name="theme-color" content="#FCFCFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HITOHI">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-step="list">

<header class="topbar">
  <nav class="steps" id="steps" aria-label="今日の進め方">
    <button class="step" type="button" data-step="list"><span class="step-mark">○</span><span class="step-no">①</span><span class="step-name">LIST</span></button>
    <button class="step" type="button" data-step="top3"><span class="step-mark">○</span><span class="step-no">②</span><span class="step-name">TOP 3</span></button>
    <button class="step" type="button" data-step="time"><span class="step-mark">○</span><span class="step-no">③</span><span class="step-name">TIME</span></button>
    <button class="step" type="button" data-step="done"><span class="step-mark">○</span><span class="step-no">④</span><span class="step-name">CHECK</span></button>
  </nav>

  <div class="datebar">
    <button class="daynav" type="button" id="prevDay" aria-label="前の日へ">←</button>
    <div class="dateblock">
      <span class="date-main" id="dateMain">2026 / 09 / 20</span>
      <span class="date-sub" id="dateSub">日曜日</span>
    </div>
    <button class="daynav" type="button" id="nextDay" aria-label="次の日へ">→</button>
    <div class="datebar-actions">
      <button class="pill" type="button" id="todayBtn">TODAY</button>
      <button class="pill" type="button" id="pagesBtn">ページ一覧</button>
    </div>
  </div>
</header>

<main class="page">
  <section class="timecol" id="timecol" aria-label="時間割">
    <div class="timeline" id="timeline"></div>
  </section>

  <div class="panels">
    <section class="panel panel-important" id="panelImportant">
      <h2 class="panel-title">IMPORTANT</h2>
      <div class="slots" id="slots"></div>
    </section>

    <section class="panel panel-todo" id="panelTodo">
      <h2 class="panel-title">TO DO <span class="count" id="todoCount"></span></h2>
      <ul class="todos" id="todos"></ul>
      <div class="addrow">
        <input class="addinput" id="addInput" type="text" inputmode="text" autocomplete="off"
               enterkeyhint="done" placeholder="ToDo を書き出す">
        <button class="addbtn" type="button" id="addBtn" aria-label="ToDoを追加">＋</button>
      </div>
    </section>

    <section class="panel panel-memo" id="panelMemo">
      <h2 class="panel-title">MEMO</h2>
      <textarea class="memo" id="memo"></textarea>
    </section>
  </div>
</main>

<div class="sheet-layer" id="sheetLayer" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="script.js"></script>
</body>
</html>
